---
layout: page
title: 你好
subtitle: 只是一个简单的博客，我也不知道我为什么创建它
sitemap:
  priority: 0.9
---

<ul class="list-posts">
    {% for post in site.posts %}
        <li class="post-teaser">
            <a href="{{ post.url | prepend: site.baseurl }}">
                <span class="post-teaser__title">{{ post.title }}{% if post.layout == "password" %}<span class="post-teaser__lock">[加密文章]</span>{% endif %}</span>
                <span class="post-teaser__date">{{ post.date | date: "%d %B %Y" }}</span>
            </a>
        </li>
    {% endfor %}
</ul>
