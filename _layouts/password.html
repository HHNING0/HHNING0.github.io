---
layout: default
---
{% include post/title.html %}

<style>
.locked-gate {
    text-align: center;
    margin: 40px 0;
    font-family: 'Inconsolata', monospace;
}
.locked-gate__hint {
    font-size: 16px;
    color: #828282;
    letter-spacing: 2px;
    margin-bottom: 30px;
}
.locked-gate form {
    display: inline-block;
}
.locked-gate input[type="password"] {
    font-family: 'Inconsolata', monospace;
    font-size: 18px;
    color: #333;
    background: transparent;
    border: none;
    border-bottom: 1px solid #828282;
    padding: 8px 12px;
    text-align: center;
    outline: none;
    letter-spacing: 3px;
    width: 220px;
}
.locked-gate input[type="password"]:focus {
    border-bottom-color: #333;
}
.locked-gate button {
    font-family: 'Inconsolata', monospace;
    font-size: 16px;
    color: #F5F5F5;
    background: #333;
    border: none;
    padding: 9px 26px;
    margin-left: 12px;
    cursor: pointer;
    letter-spacing: 2px;
    text-transform: uppercase;
}
.locked-gate button:hover {
    background: #828282;
}
.locked-gate__error {
    color: #b00020;
    font-size: 14px;
    letter-spacing: 1px;
    margin-top: 20px;
    display: none;
}
@media (max-width: 480px) {
    .locked-gate form {
        display: block;
    }
    .locked-gate input[type="password"] {
        width: 80%;
        max-width: 220px;
        box-sizing: border-box;
        display: block;
        margin: 0 auto 15px;
    }
    .locked-gate button {
        margin-left: 0;
        display: inline-block;
        padding: 9px 26px;
    }
}
</style>

<div class="content" id="locked">
    <div class="locked-gate">
        <div class="locked-gate__hint">
            &gt; 该文章已加密，请输入密码解锁
        </div>
        <form onsubmit="unlock(event)">
            <input type="password" id="pwd" placeholder="密码" autofocus>
            <button type="submit">解锁</button>
        </form>
        <p id="pwd-error" class="locked-gate__error">密码错误，请重试</p>
    </div>
</div>

<div class="content" id="article" style="display:none"></div>

<script src="{{ "/assets/vendor/marked/marked.min.js" | prepend: site.baseurl }}?v={{ site.time | date: '%s' }}"></script>
<script>
const SECRET = "{{ page.secret }}";

function b64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
}

async function decrypt(secret, password) {
    const [iv, salt, data, tag] = secret.split(':').map(b64ToBytes);
    const keyMaterial = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false, ['decrypt']
    );
    // Node 端 tag 与 ciphertext 分离，浏览器端需拼回末尾
    const ciphertext = new Uint8Array(data.length + tag.length);
    ciphertext.set(data, 0);
    ciphertext.set(tag, data.length);
    const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
    return new TextDecoder().decode(decrypted);
}

async function unlock(e) {
    e.preventDefault();
    const password = document.getElementById('pwd').value;
    document.getElementById('pwd-error').style.display = 'none';
    try {
        const md = await decrypt(SECRET, password);
        document.getElementById('article').innerHTML = marked.parse(md);
        document.getElementById('article').style.display = '';
        document.getElementById('locked').style.display = 'none';
    } catch (err) {
        document.getElementById('pwd-error').style.display = 'block';
    }
}
</script>
